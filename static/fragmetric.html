        .pagination {

            align-items: center;
            padding: 15px;
            gap: 10px;
        }
        
        .pagination-button {
            background-color: #007d3a;
            color: #fff;

        /* Back button */
        .back-button {
            display: inline-flex;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.1);

            border-radius: 4px;
            margin-bottom: 20px;

        }
        
        .live-feed {

            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #007d3a #1a1a1a;

        .live-feed::-webkit-scrollbar {

        }
        
        .live-feed::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }
        
        .live-feed::-webkit-scrollbar-thumb {

        .feed-address:hover {
            color: #ffffff;
            text-decoration: underline;

        .feed-amount {
            font-weight: 700;
            margin-left: auto;
            margin-right: 10px;

            color: #007d3a;

        .feed-time {
            color: #777;
            font-size: 0.75rem;
            width: 60px;
            text-align: right;

        .investor-modal {

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            opacity: 1;

        .investor-details h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #007d3a;
            border-bottom: 1px solid rgba(0, 125, 58, 0.3);
            padding-bottom: 10px;
        }

        .investor-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 20px 0;
        }

        .investor-stat {
            background: linear-gradient(145deg, rgba(26, 42, 26, 0.7), rgba(15, 31, 15, 0.7));
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(0, 125, 58, 0.15);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

        .investor-stat-value {
            font-size: 1.5rem;
            font-weight: bold;

        .investor-stat-label {

            color: #b0b0b0;

        .vesting-price {

            margin-bottom: 8px;

        .vesting-terms {
            font-size: 12px;
            color: #9ca3af;

        .price-stats-grid {
            margin-bottom: 20px;

        .vesting-container {

            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 125, 58, 0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;

            font-weight: 600;
            color: var(--primary-color);

            position: relative;

            transition: width 0.3s ease;

        .progress-fill.shimmer {

            background-size: 200% 100%;
            animation: shimmer 2s infinite;

            margin-top: 8px;

            color: var(--primary-color);

            color: var(--primary-color);

<body>
    <!-- Root div where React will render -->
    <div id="app">Loading...</div>
    
    <!-- React app script -->
    <script type="text/babel">
        const CONFIG = {
            pageTitle: "Fragmetric Legion Sale Tracker",
            projectName: "Fragmetric",
            logoSrc: "fragmetric.png",
            logoAlt: "Fragmetric Logo",
            favicon: "fragmetric.png",
            apiEndpoints: {
                totalInvestment: "/api/fragmetric/total-investment",
                deposits: "/api/fragmetric/deposits",
                investor: "/api/investor/:address",

        // VestingProgress Component
        const VestingProgress = () => {
            const [timeLeft, setTimeLeft] = React.useState({});
            const [phase, setPhase] = React.useState('pre-tge'); // pre-tge, immediate, lockup, vesting, complete

            React.useEffect(() => {
                const updateCountdown = () => {
                    const now = new Date();
                    const tgeDate = CONFIG.vestingConfig.tgeDate;
                    const lockupEndDate = new Date(tgeDate.getTime() + (CONFIG.vestingConfig.lockupMonths * 30 * 24 * 60 * 60 * 1000));
                    const vestingEndDate = new Date(lockupEndDate.getTime() + (CONFIG.vestingConfig.vestingMonths * 30 * 24 * 60 * 60 * 1000));

                    let targetDate, currentPhase, timeDiff;

                    if (now < tgeDate) {
                        currentPhase = 'pre-tge';
                        targetDate = tgeDate;
                        timeDiff = targetDate - now;
                    } else if (now < lockupEndDate) {
                        currentPhase = 'lockup';
                        targetDate = lockupEndDate;
                        timeDiff = targetDate - now;
                    } else if (now < vestingEndDate) {
                        currentPhase = 'vesting';
                        targetDate = vestingEndDate;
                        timeDiff = targetDate - now;
                    } else {
                        currentPhase = 'complete';
                        timeDiff = 0;
                    }

                    setPhase(currentPhase);

                    if (timeDiff > 0) {
                        const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

                        setTimeLeft({ days, hours, minutes, seconds });
                    } else {
                        setTimeLeft({});
                    }
                };

                updateCountdown();
                const interval = setInterval(updateCountdown, 1000);
                return () => clearInterval(interval);
            }, []);

            const getProgressData = () => {
                const now = new Date();
                const tgeDate = CONFIG.vestingConfig.tgeDate;
                const lockupEndDate = new Date(tgeDate.getTime() + (CONFIG.vestingConfig.lockupMonths * 30 * 24 * 60 * 60 * 1000));
                const vestingEndDate = new Date(lockupEndDate.getTime() + (CONFIG.vestingConfig.vestingMonths * 30 * 24 * 60 * 60 * 1000));

                switch (phase) {
                    case 'pre-tge':
                        return {
                            progress: 0,
                            unlocked: 0,
                            title: "Token Generation Event",
                            subtitle: "TGE has not occurred yet"
                        };
                    case 'lockup':
                        return {
                            progress: 10, // Show the immediate unlock portion
                            unlocked: CONFIG.vestingConfig.immediateUnlockPercent,
                            title: "Lockup Period",
                            subtitle: `${CONFIG.vestingConfig.immediateUnlockPercent}% unlocked at TGE, remaining in lockup`
                        };
                    case 'vesting':
                        const vestingStart = lockupEndDate;
                        const vestingDuration = vestingEndDate - vestingStart;
                        const vestingElapsed = now - vestingStart;
                        const vestingProgress = Math.min(vestingElapsed / vestingDuration, 1);
                        const additionalUnlocked = (100 - CONFIG.vestingConfig.immediateUnlockPercent) * vestingProgress;
                        const totalUnlocked = CONFIG.vestingConfig.immediateUnlockPercent + additionalUnlocked;
                        
                        return {
                            progress: 10 + (vestingProgress * 90), // 10% immediate + progress through remaining 90%
                            unlocked: totalUnlocked,
                            title: "Vesting in Progress",
                            subtitle: "Tokens are being unlocked linearly"
                        };
                    case 'complete':
                        return {
                            progress: 100,
                            unlocked: 100,
                            title: "Vesting Complete",
                            subtitle: "All tokens have been unlocked"
                        };
                    default:
                        return { progress: 0, unlocked: 0, title: "", subtitle: "" };
                }
            };

            const formatCountdown = () => {
                if (Object.keys(timeLeft).length === 0) return "";
                const { days, hours, minutes, seconds } = timeLeft;
                return `${days}d ${hours}h ${minutes}m ${seconds}s`;
            };

            const getCountdownLabel = () => {
                switch (phase) {
                    case 'pre-tge': return "Until TGE";
                    case 'lockup': return "Until Lockup Ends";
                    case 'vesting': return "Until Fully Unlocked";
                    default: return "";
                }
            };

            const progressData = getProgressData();

            return (
                <div className="vesting-container">
                    <div className="vesting-header">
                        <div className="vesting-title">{progressData.title}</div>
                        {Object.keys(timeLeft).length > 0 && (
                            <div className="countdown-timer">
                                {formatCountdown()} {getCountdownLabel()}
                            </div>
                        )}
                    </div>

                    <div className="progress-section">
                        <div className="progress-bar">
                            <div 
                                className={`progress-fill ${phase === 'vesting' ? 'shimmer' : ''}`}
                                style={{ width: `${progressData.progress}%` }}
                            ></div>
                        </div>
                        <div className="progress-text">
                            {progressData.unlocked.toFixed(1)}% Unlocked
                        </div>
                    </div>

                    <div className="vesting-info">
                        <div className="info-box">
                            <div className="info-label">TGE Date</div>

                        <div className="info-box">

        function TrackerApp() {
            const [deposits, setDeposits] = React.useState([]);
            const [totalInvestment, setTotalInvestment] = React.useState(0);
            const [loading, setLoading] = React.useState(true);
            const [error, setError] = React.useState(null);
            const [sortOrder, setSortOrder] = React.useState('desc');
            const [currentPage, setCurrentPage] = React.useState(1);
            const [stats, setStats] = React.useState({ average: 0, median: 0, highest: 0, lowest: 0 });
            const [priceData, setPriceData] = React.useState({
                salePrice: CONFIG.salePrice,
                currentPrice: 0,
                athPrice: 0,
                lowestPrice: 0,
                currentRoi: 0,
                athRoi: 0,
                loading: true,
                error: null,
            });
            const [selectedInvestor, setSelectedInvestor] = React.useState(null);
            const [showModal, setShowModal] = React.useState(false);
            const [investorLoading, setInvestorLoading] = React.useState(false);
            const [inputValue, setInputValue] = React.useState('');
            const [calculatorMode, setCalculatorMode] = React.useState(CONFIG.calculatorModes[0]);
            const [calculationResult, setCalculationResult] = React.useState(null);
            const [calculatorLoading, setCalculatorLoading] = React.useState(false);

            React.useEffect(() => {
                fetchData();
                fetchTokenPriceData();
            }, []);

            const handleBack = () => {
                window.location.href = CONFIG.backLink;
            };
            
            const fetchData = async () => {
                try {
                    setLoading(true);
                    const totalRes = await fetch(CONFIG.apiEndpoints.totalInvestment);
                    if (!totalRes.ok) throw new Error('Failed to fetch total investment');
                    const totalData = await totalRes.json();
                    setTotalInvestment(totalData.total);

                    const depositsRes = await fetch(CONFIG.apiEndpoints.deposits);
                    if (!depositsRes.ok) throw new Error('Failed to fetch deposits');
                    const depositsData = await depositsRes.json();
                    setDeposits(depositsData.deposits || []);

                    if (depositsData.deposits && depositsData.deposits.length > 0) {
                        const amounts = depositsData.deposits.map(d => d.amount);
                        const sortedAmounts = [...amounts].sort((a, b) => a - b);
                        setStats({
                            average: amounts.reduce((a, b) => a + b, 0) / amounts.length,
                            median: sortedAmounts.length % 2 === 0
                                ? (sortedAmounts[sortedAmounts.length / 2 - 1] + sortedAmounts[sortedAmounts.length / 2]) / 2
                                : sortedAmounts[Math.floor(sortedAmounts.length / 2)],
                            highest: Math.max(...amounts),
                            lowest: Math.min(...amounts),
                        });
                    }
                    setLoading(false);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            const fetchTokenPriceData = async () => {
                try {
                    const response = await fetch(CONFIG.apiEndpoints.price.replace(':tokenId', CONFIG.coingecko.tokenId));
                    if (!response.ok) {
                        throw new Error('Failed to fetch price data');
                    }
                    const data = await response.json();

                    const currentPrice = data.current_price || 0;
                    const athPrice = data.ath || 0;
                    const lowestPrice = data.atl || 0;

                    const currentRoi = currentPrice > 0 ? ((currentPrice - CONFIG.salePrice) / CONFIG.salePrice) * 100 : 0;
                    const athRoi = athPrice > 0 ? ((athPrice - CONFIG.salePrice) / CONFIG.salePrice) * 100 : 0;

                    setPriceData({
                        salePrice: CONFIG.salePrice,
                        currentPrice,
                        athPrice,
                        lowestPrice,
                        currentRoi,
                        athRoi,
                        loading: false,
                        error: null,
                    });
                } catch (error) {
                    console.error('Error fetching price data:', error);
                    setPriceData(prev => ({
                        ...prev,
                        loading: false,
                        error: error.message,
                    }));
                }
            };
            
            const formatAmount = (amount, isPrice = false) => {
                if (amount === null || amount === undefined) return isPrice ? "$0.00" : "$0.00";
                const value = Number(amount);
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: isPrice ? 4 : 2,
                    maximumFractionDigits: isPrice ? 4 : 2
                }).format(value);
            };

            const formatAddress = (address) => {
                if (!address) return '';
                return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
            };

            const handleCalculate = async () => {
                if (!inputValue) return;
                setCalculatorLoading(true);

                try {
                    let investmentAmount = 0;
                    let tokensReceived = 0;

                    if (calculatorMode === 'amount') {
                        investmentAmount = parseFloat(inputValue);
                        tokensReceived = investmentAmount / CONFIG.salePrice;
                    } else if (calculatorMode === 'tokens') {
                        tokensReceived = parseFloat(inputValue);
                        investmentAmount = tokensReceived * CONFIG.salePrice;
                    } else if (calculatorMode === 'address') {
                        const response = await fetch(CONFIG.apiEndpoints.investor.replace(':address', inputValue));
                        if (!response.ok) throw new Error('Address not found');
                        const data = await response.json();
                        
                        const fragmetricSales = data.sales.filter(sale => sale.sale.toLowerCase() === CONFIG.projectName.toLowerCase());
                        investmentAmount = fragmetricSales.reduce((sum, sale) => sum + sale.amount, 0);
                        tokensReceived = investmentAmount / CONFIG.salePrice;
                    }

                    const currentValue = tokensReceived * (priceData.currentPrice || 0);
                    const currentPnL = currentValue - investmentAmount;
                    const currentPnLPercent = investmentAmount > 0 ? (currentPnL / investmentAmount) * 100 : 0;

                    const athValue = tokensReceived * (priceData.athPrice || 0);
                    const athPnL = athValue - investmentAmount;
                    const athPnLPercent = investmentAmount > 0 ? (athPnL / investmentAmount) * 100 : 0;

                    const lowestValue = tokensReceived * (priceData.lowestPrice || 0);
                    const lowestPnL = lowestValue - investmentAmount;
                    const lowestPnLPercent = investmentAmount > 0 ? (lowestPnL / investmentAmount) * 100 : 0;

                    setCalculationResult({
                        investmentAmount,
                        tokensReceived,
                        currentValue,
                        currentPnL,
                        currentPnLPercent,
                        athValue,
                        athPnL,
                        athPnLPercent,
                        lowestValue,
                        lowestPnL,
                        lowestPnLPercent,
                    });
                } catch (error) {
                    setCalculationResult({ error: error.message });
                }

                setCalculatorLoading(false);
            };
            
            // Sort deposits based on current sort order
            const sortedDeposits = React.useMemo(() => {
                if (!deposits || !deposits.length) return [];
                return [...deposits].sort((a, b) => {
                    return sortOrder === 'desc' ? b.amount - a.amount : a.amount - b.amount;
                });
            }, [deposits, sortOrder]);
            
            // Toggle sort order
            const toggleSortOrder = () => {
                setSortOrder(sortOrder === 'desc' ? 'asc' : 'desc');
            };
            
            // Pagination calculations
            const indexOfLastDeposit = currentPage * CONFIG.depositsPerPage;
            const indexOfFirstDeposit = indexOfLastDeposit - CONFIG.depositsPerPage;
            const currentDeposits = sortedDeposits.slice(indexOfFirstDeposit, indexOfLastDeposit);
            const totalPages = Math.max(1, Math.ceil((deposits && deposits.length ? deposits.length : 0) / CONFIG.depositsPerPage));
            
            const handleInvestorClick = async (address) => {
                try {
                    setInvestorLoading(true);
                    setShowModal(true);
                    setSelectedInvestor(null);
                    const response = await fetch(CONFIG.apiEndpoints.investor.replace(':address', address));
                    if (!response.ok) throw new Error(`Failed to fetch investor details: ${response.status}`);
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);
                    const allSales = data.sales;
                    const fragmetricSales = allSales.filter(sale => sale.sale.toLowerCase() === CONFIG.projectName.toLowerCase());
                    const fragmetricTotal = fragmetricSales.reduce((sum, sale) => sum + sale.amount, 0);
                    setSelectedInvestor({
                        address,
                        total_invested: allSales.reduce((sum, sale) => sum + sale.amount, 0),
                        fragmetric_total: fragmetricTotal,
                        sales_participated: allSales.length,
                        fragmetric_sales: fragmetricSales.length,
                        sales: allSales,
                    });
                } catch (error) {
                    setSelectedInvestor(null);
                } finally {
                    setInvestorLoading(false);
                }
            };
            
            // Show loading state
            if (loading) {
                return (
                    <div className="flex items-center justify-center h-screen">
                        <div className="text-center p-8 card max-w-md">
                            <div className="inline-block w-12 h-12 border-4 border-t-transparent border-green-600 rounded-full animate-spin mb-6"></div>
                            <p className="mb-4 text-lg">Loading Fragmetric Sale Data...</p>
                        </div>
                    </div>
                );
            }
            
            // Show error state
            if (error) {
                return (
                    <div className="main-container">
                        <div className="card p-8 text-center">
                            <h2 className="text-xl text-red-500 mb-4">Error</h2>
                            <p>{error}</p>
                            <button 
                                onClick={fetchData} 
                                className="pagination-button mt-4"
                            >
                                Retry
                            </button>
                        </div>
                    </div>
                );
            }
            
            // Main component render
            return (
                <div className="main-container">
                    <a href={CONFIG.backLink} className="back-button">
                        <i className="fas fa-arrow-left mr-2"></i>
                        {CONFIG.backLinkText}
                    </a>
                    <div className="header-card">
                        <div className="header-title">{CONFIG.projectName}</div>
                        <img src={CONFIG.logoSrc} alt={CONFIG.logoAlt} className="h-16" />
                    </div>
                    <PriceStats priceData={priceData} formatAmount={formatAmount} />
                    <div className="price-stats-grid">
                        <div className="card p-4">
                            <div className="stats-title mb-4">Vesting Terms</div>
                            <div className="grid grid-cols-1 gap-4">
                                <div className="vesting-option">
                                    <div className="vesting-fdv">FDV $125,000,000</div>
                                    <div className="vesting-price">$0.20 per FRAG</div>
                                    <div className="vesting-terms">10% at TGE, remaining 90% subject to 12-month lockup, followed by 24-month monthly linear unlock</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* Main Content Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* Left Column - Stats and Live Feed */}
                        <div className="md:col-span-1">
                            {/* Total USDC Card */}
                            <div className="card p-6 text-center">
                                <div className="card-title">Total USDC Invested</div>
                                <div className="amount-display">{formatAmount(totalInvestment)}</div>
                                <div className="text-gray-400 text-sm flex items-center justify-center">
                                    <i className="fas fa-users mr-2 text-green-600"></i>
                                    {deposits && deposits.length ? deposits.length : 0} unique addresses
                                </div>
                            </div>
                            
                            {/* Stats section */}
                            <div className="stats-section">
                                <div className="stats-title">Investment Stats</div>
                                
                                <div className="stats-card">
                                    <div className="stats-label">Average</div>
                                    <div className="stats-value">{formatAmount(stats.average)}</div>
                                </div>
                                
                                <div className="stats-card">
                                    <div className="stats-label">Median</div>
                                    <div className="stats-value">{formatAmount(stats.median)}</div>
                                </div>
                                
                                <div className="stats-card">
                                    <div className="stats-label">Highest</div>
                                    <div className="stats-value">{formatAmount(stats.highest)}</div>
                                </div>
                                
                                <div className="stats-card">
                                    <div className="stats-label">Lowest</div>
                                    <div className="stats-value">{formatAmount(stats.lowest)}</div>
                                </div>
                            </div>
                            <ROICalculator
                                calculatorMode={calculatorMode}
                                setCalculatorMode={setCalculatorMode}
                                inputValue={inputValue}
                                setInputValue={setInputValue}
                                handleCalculate={handleCalculate}
                                calculatorLoading={calculatorLoading}
                                calculationResult={calculationResult}
                                priceData={priceData}
                                formatAmount={formatAmount}
                            />
                        </div>
                        
                        {/* Right Column - Investors Table */}
                        <div className="md:col-span-2">
                            <div className="card">
                                <div className="p-4 border-b border-gray-800">
                                    <div className="card-title">Top Investors</div>
                                    <div className="card-subtitle">Ranked by investment amount</div>
                                </div>
                                
                                <div className="table-container">
                                    <table className="data-table">
                                        <thead>
                                            <tr className="table-header">
                                                <th>Rank</th>
                                                <th>Address</th>
                                                <th className="cursor-pointer" onClick={toggleSortOrder}>
                                                    Amount {sortOrder === 'desc' ? '↓' : '↑'}
                                                </th>
                                                <th className="text-right">% of Total</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {currentDeposits && currentDeposits.length > 0 ? (
                                                currentDeposits.map((deposit, index) => (
                                                    <tr key={deposit.address} className="table-row">
                                                        <td>
                                                            {indexOfFirstDeposit + index + 1 <= 3 ? (
                                                                <span className="rank-badge">{indexOfFirstDeposit + index + 1}</span>
                                                            ) : (
                                                                <span>#{indexOfFirstDeposit + index + 1}</span>
                                                            )}
                                                        </td>
                                                        <td className="address-cell">
                                                            <a
                                                                href="#"
                                                                onClick={(e) => {
                                                                    e.preventDefault();
                                                                    handleInvestorClick(deposit.address);
                                                                }}
                                                                title={deposit.address}
                                                            >
                                                                {formatAddress(deposit.address)}
                                                            </a>
                                                        </td>
                                                        <td className="text-right font-mono">
                                                            {formatAmount(deposit.amount)}
                                                        </td>
                                                        <td className="text-right">
                                                            {((deposit.amount / totalInvestment) * 100).toFixed(2)}%
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr className="table-row">
                                                    <td colSpan="4" className="text-center py-8">
                                                        <div>
                                                            <i className="fas fa-info-circle mr-2 text-yellow-500"></i>
                                                            No investments detected yet.
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                
                                {/* Pagination */}
                                {totalPages > 1 && (
                                    <div className="pagination">
                                        <button
                                            onClick={() => setCurrentPage(p => Math.max(p - 1, 1))}
                                            disabled={currentPage === 1}
                                            className="pagination-button"
                                        >
                                            Previous
                                        </button>
                                        
                                        <div className="pagination-info">
                                            {currentPage} of {totalPages}
                                        </div>
                                        
                                        <button
                                            onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))}
                                            disabled={currentPage === totalPages}
                                            className="pagination-button"
                                        >
                                            Next
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                    
                    <InvestorModal
                        showModal={showModal}
                        setShowModal={setShowModal}
                        selectedInvestor={selectedInvestor}
                        investorLoading={investorLoading}
                        formatAmount={formatAmount}
                    />
                </div>
            );
        }
        
        // Render the React component
        ReactDOM.render(<TrackerApp />, document.getElementById('app'));
    </script>
</body>
</html>
