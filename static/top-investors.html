<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Top Investors</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="legion.png">
    <link rel="shortcut icon" type="image/png" href="legion.png">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f14 0%, #151520 50%, #1a1a25 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Add subtle geometric background pattern - same as dashboard */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 87, 34, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 87, 34, 0.05) 0%, transparent 50%),
                linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.01) 50%, transparent 60%);
            background-size: 400px 400px, 600px 600px, 100px 100px;
            pointer-events: none;
            z-index: -1;
        }

        /* Header styling - consistent with dashboard */
        .header {
            background: rgba(19, 19, 31, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 87, 34, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e0e0e0;
            text-shadow: 0 0 20px rgba(255, 87, 34, 0.4);
            position: relative;
            text-align: center;
            background: linear-gradient(
                90deg,
                #e0e0e0 0%,
                #e0e0e0 30%,
                #ff5722 40%,
                #ffab40 50%,
                #ff5722 60%,
                #e0e0e0 70%,
                #e0e0e0 100%
            );
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: traveling-light-header 4s ease-in-out infinite;
        }

        @keyframes traveling-light-header {
            0% {
                background-position: -200% 0;
            }
            50% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* Add glow effect overlay for header title */
        .header-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                transparent 30%,
                rgba(255, 87, 34, 0.7) 40%,
                rgba(255, 171, 64, 0.9) 50%,
                rgba(255, 87, 34, 0.7) 60%,
                transparent 70%,
                transparent 100%
            );
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: traveling-glow-header 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes traveling-glow-header {
            0% {
                background-position: -200% 0;
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                background-position: 200% 0;
                opacity: 0;
            }
        }

        .nav-button {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 87, 34, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 87, 34, 0.3);
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-button:hover {
            background: rgba(255, 87, 34, 0.2);
            transform: translateY(-50%) translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 87, 34, 0.2);
            border-color: rgba(255, 87, 34, 0.5);
        }

        .nav-button i {
            margin-right: 0.5rem;
        }

        /* Main container - consistent with dashboard */
        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 87, 34, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        /* Stats section */
        .stats-section {
            background: rgba(21, 21, 31, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            border: 1px solid rgba(255, 87, 34, 0.15);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stats-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 87, 34, 0.5), transparent);
        }



        .stats-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 87, 34, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }



        .stat-label {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ff5722;
        }

        /* Table section */
        .table-section {
            background: rgba(21, 21, 31, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 87, 34, 0.15);
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        .table-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 87, 34, 0.5), transparent);
        }



        /* Filter bar */
        .filter-bar {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }



        .filter-button.active {
            background: rgba(255, 87, 34, 0.15);
            border-color: rgba(255, 87, 34, 0.4);
            color: #ff5722;
        }

        .search-container {
            margin-left: auto;
            position: relative;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            width: 250px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 87, 34, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
        }

        /* Table */
        .table-header {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: grid;
            grid-template-columns: 60px 1fr 150px 120px 200px 120px;
            padding: 1rem 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-body {
            max-height: 600px;
            overflow-y: auto;
        }

        .table-row {
            display: grid;
            grid-template-columns: 60px 1fr 150px 120px 200px 120px;
            padding: 1rem 1.5rem;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .table-row:hover {
            background: rgba(255, 87, 34, 0.05);
        }

        /* Table content styling */
        .investor-rank {
            font-size: 1rem;
            font-weight: 600;
            color: #ff5722;
        }

        .investor-address {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.875rem;
            color: #ffffff;
        }

        .investment-amount {
            font-size: 1rem;
            font-weight: 600;
            color: #ff5722;
        }

        .sales-count {
            font-size: 1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Sale badges */
        .sale-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .sale-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 87, 34, 0.1);
            color: #ff5722;
            border: 1px solid rgba(255, 87, 34, 0.2);
        }

        /* Action button */
        .action-button {
            background: rgba(255, 87, 34, 0.1);
            border: 1px solid rgba(255, 87, 34, 0.3);
            color: #ff5722;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }



        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
        }

        .page-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }



        .page-button.active {
            background: rgba(255, 87, 34, 0.15);
            border-color: rgba(255, 87, 34, 0.4);
            color: #ff5722;
        }

        .page-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-jump-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.875rem;
            width: 80px;
            text-align: center;
        }

        .page-jump-input:focus {
            outline: none;
            border-color: rgba(255, 87, 34, 0.4);
        }

        /* Modal styling - Glassy appearance */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(15, 15, 20, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 2px solid rgba(255, 87, 34, 0.4);
            border-radius: 24px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 87, 34, 0.8) 20%, 
                rgba(255, 171, 64, 0.9) 50%, 
                rgba(255, 87, 34, 0.8) 80%, 
                transparent
            );
            border-radius: 24px 24px 0 0;
        }

        .modal-content::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.05) 0%, 
                transparent 20%, 
                transparent 80%, 
                rgba(255, 87, 34, 0.05) 100%
            );
            border-radius: 24px;
            pointer-events: none;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 87, 34, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, 
                rgba(255, 87, 34, 0.08) 0%, 
                rgba(255, 87, 34, 0.04) 50%, 
                rgba(255, 87, 34, 0.08) 100%
            );
            backdrop-filter: blur(10px);
            border-radius: 24px 24px 0 0;
            position: relative;
            z-index: 2;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 87, 34, 0.4);
        }

        .modal-close {
            background: rgba(255, 87, 34, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 87, 34, 0.4);
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: none;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.2);
        }

        .modal-body {
            padding: 1.5rem;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.03) 0%, 
                rgba(255, 255, 255, 0.01) 50%, 
                rgba(255, 87, 34, 0.02) 100%
            );
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 1;
        }

        .sale-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.05) 0%, 
                rgba(255, 255, 255, 0.02) 50%, 
                rgba(255, 87, 34, 0.03) 100%
            );
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 87, 34, 0.15);
            transition: all 0.3s ease;
            margin-bottom: 0.75rem;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .sale-name {
            display: flex;
            align-items: center;
        }

        .sale-amount {
            font-weight: 600;
            color: #ff5722;
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1) 25%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.1) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-text {
            height: 16px;
            width: 80%;
        }

        .skeleton-text-lg {
            height: 20px;
            width: 70%;
        }

        .skeleton-button {
            height: 32px;
            width: 100px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
                gap: 1rem;
            }

            .header-content {
                padding: 0 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table-header,
            .table-row {
                grid-template-columns: 40px 1fr 100px 80px 120px 80px;
                padding: 0.75rem 1rem;
                font-size: 0.8rem;
            }

            .search-input {
                width: 200px;
            }

            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .search-container {
                margin-left: 0;
            }
        }

        /* Project-specific badge colors */
        .almanak-badge { background: rgba(139, 69, 19, 0.2); color: #deb887; border-color: rgba(139, 69, 19, 0.4); }
        .giza-badge { background: rgba(255, 248, 220, 0.1); color: #fff8dc; border-color: rgba(255, 248, 220, 0.3); }
        .skate-badge { background: rgba(197, 255, 51, 0.1); color: #c5ff33; border-color: rgba(197, 255, 51, 0.3); }
        .pulse-badge { background: rgba(255, 20, 147, 0.1); color: #ff1493; border-color: rgba(255, 20, 147, 0.3); }
        .fuel-badge { background: rgba(0, 255, 127, 0.1); color: #00ff7f; border-color: rgba(0, 255, 127, 0.3); }
        .electron-badge { background: rgba(72, 61, 139, 0.2); color: #9370db; border-color: rgba(72, 61, 139, 0.4); }
        .corn-badge { background: rgba(255, 215, 0, 0.1); color: #ffd700; border-color: rgba(255, 215, 0, 0.3); }
        .enclave-badge { background: rgba(105, 105, 105, 0.2); color: #c0c0c0; border-color: rgba(105, 105, 105, 0.4); }
        .nil-badge { background: rgba(255, 255, 255, 0.1); color: #ffffff; border-color: rgba(255, 255, 255, 0.3); }
        .silencio-badge { background: rgba(64, 64, 64, 0.2); color: #a9a9a9; border-color: rgba(64, 64, 64, 0.4); }
        .session-badge { background: rgba(0, 191, 255, 0.1); color: #00bfff; border-color: rgba(0, 191, 255, 0.3); }
        .fragmetric-badge { background: rgba(255, 165, 0, 0.1); color: #ffa500; border-color: rgba(255, 165, 0, 0.3); }
        .resolv-badge { background: rgba(102, 150, 174, 0.2); color: #6696ae; border-color: rgba(102, 150, 174, 0.4); }
        .lit-badge { background: rgba(255, 69, 0, 0.1); color: #ff4500; border-color: rgba(255, 69, 0, 0.3); }
        .eoracle-badge { background: rgba(138, 43, 226, 0.1); color: #8a2be2; border-color: rgba(138, 43, 226, 0.3); }
        .overlay-badge { background: rgba(0, 128, 128, 0.1); color: #40e0d0; border-color: rgba(0, 128, 128, 0.3); }
        .ten-badge { background: rgba(0, 212, 255, 0.1); color: #00d4ff; border-color: rgba(0, 212, 255, 0.3); }

        /* Custom Scrollbar Styling to Match Theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(21, 21, 31, 0.6);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.6), rgba(255, 87, 34, 0.4));
            border-radius: 10px;
            border: 1px solid rgba(255, 87, 34, 0.2);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.8), rgba(255, 87, 34, 0.6));
        }

        ::-webkit-scrollbar-corner {
            background: rgba(21, 21, 31, 0.6);
        }

        /* Firefox scrollbar styling */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 87, 34, 0.6) rgba(21, 21, 31, 0.6);
        }

        /* Copied message animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(5px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0px); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0px); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-5px); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="header-title" data-text="LEGION TOP INVESTORS">LEGION TOP INVESTORS</h1>
            <a href="/dashboard" class="nav-button">
                <i class="fas fa-chart-line"></i>Dashboard
            </a>
        </div>
    </header>
    
    <!-- Main Content -->

    <script>
        // Project colors for badges

        const projectLogos = {

            'giza': 'giza.jpg',

            'fuel': 'fuel.png',

            'corn': 'corn.png',
            'enclave': 'enclave.jpg',

        // State variables
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 25;
        let currentSort = 'total';
        let searchTerm = '';
        let investors = [];

        // Copy to clipboard functionality
        function copyToClipboard(text, button) {
            // Fallback for older browsers
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopySuccess(button);
                }).catch(() => {
                    fallbackCopyTextToClipboard(text, button);
                });
            } else {
                fallbackCopyTextToClipboard(text, button);
            }
        }

        function fallbackCopyTextToClipboard(text, button) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopySuccess(button);
                } else {
                    console.error('Copy command failed');
                }
            } catch (err) {
                console.error('Fallback copy failed:', err);
            }
            
            document.body.removeChild(textArea);
        }

        function showCopySuccess(button) {
            // Change icon to checkmark and show "Copied!" text
            const icon = button.querySelector('i');
            const originalIcon = icon.className;
            const originalBackground = button.style.background;
            const originalBorderColor = button.style.borderColor;
            const originalColor = button.style.color;
            
            icon.className = 'fas fa-check';
            button.style.background = 'rgba(76, 175, 80, 0.1)';
            button.style.borderColor = 'rgba(76, 175, 80, 0.3)';
            button.style.color = '#4caf50';
            button.title = 'Copied!';
            
            // Show a small "Copied!" message
            const copiedMsg = document.createElement('span');
            copiedMsg.textContent = 'Copied!';
            copiedMsg.style.cssText = `
                position: absolute;
                top: -25px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(76, 175, 80, 0.9);
                color: white;
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 0.7rem;
                white-space: nowrap;
                z-index: 1000;
                animation: fadeInOut 2s ease;
            `;
            
            button.style.position = 'relative';
            button.appendChild(copiedMsg);
            
            // Reset after 2 seconds
            setTimeout(() => {
                icon.className = originalIcon;
                button.style.background = originalBackground || 'rgba(255, 87, 34, 0.1)';
                button.style.borderColor = originalBorderColor || 'rgba(255, 87, 34, 0.3)';
                button.style.color = originalColor || '#ff5722';
                button.title = 'Copy full address';
                if (copiedMsg.parentNode) {
                    copiedMsg.remove();
                }
            }, 2000);
        }
        
        // Format currency helper
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }
        
        // Format address helper
        function formatAddress(address) {
            if (!address) return 'Unknown';
            
            // Check if it's a Solana address - if so, preserve exact case
            if (!address.startsWith('0x') && address.length >= 32 && address.length <= 44) {
                // For Solana addresses, show a prefix and suffix but preserve exact case
                const prefix = address.substring(0, 4);
                const suffix = address.substring(address.length - 4);
                return `${prefix}...${suffix}`;
            }
            
            // Format EVM address
            return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
        }
        
        // Function to fetch investors data
        async function fetchInvestors() {
            try {
                const url = `/api/top-investors?page=${currentPage}&limit=${pageSize}&sort=${currentSort}${searchTerm ? `&search=${searchTerm}` : ''}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch investors data');
                }
                
                const data = await response.json();
                investors = data.investors;
                totalInvestors = data.total_investors;
                totalPages = data.total_pages;
                
                updateTable();
                updatePagination();
                updateStats();
            } catch (error) {
                console.error('Error fetching investors:', error);
                document.getElementById('investors-table').innerHTML = `
                    <div class="text-center text-gray-500 py-4">
                        Error loading investors data. Please try again later.
                    </div>
                `;
            }
        }
        
        // Function to update the investors table
        function updateTable() {
            const tableBody = document.getElementById('investors-table');
            
            // Clear the table
            tableBody.innerHTML = '';
            
            if (investors.length === 0) {
                tableBody.innerHTML = `
                    <div class="text-center text-gray-500 py-4">
                        No investors found matching your criteria.
                    </div>
                `;
                return;
            }
            
            // Add investors to the table
            investors.forEach(investor => {
                const row = document.createElement('div');
                row.className = 'table-row';
                
                // Create badges for sales
                const salesBadges = document.createElement('div');
                salesBadges.className = 'sale-badges';
                
                // Add up to 5 sales badges, more will be visible in the modal
                const maxBadges = 5;
                // Ensure sales_list exists before calling slice
                const salesList = investor.sales_list || [];
                const displayedSales = salesList.slice(0, maxBadges);
                
                displayedSales.forEach(sale => {
                    const badge = document.createElement('span');
                    badge.className = `sale-badge ${projectColors[sale.sale] || ''}`;
                    badge.textContent = projectNames[sale.sale] || sale.sale;
                    salesBadges.appendChild(badge);
                });
                
                // Add "more" indicator if there are more sales
                if (salesList.length > maxBadges) {
                    const moreBadge = document.createElement('span');
                    moreBadge.className = 'sale-badge';
                    moreBadge.style.backgroundColor = '#333';
                    moreBadge.textContent = `+${salesList.length - maxBadges} more`;
                    salesBadges.appendChild(moreBadge);
                }
                
                row.innerHTML = `
                    <div class="investor-rank">#${investor.rank || 'N/A'}</div>
                    <div class="investor-address">${formatAddress(investor.address)}</div>
                    <div class="investment-amount">${formatCurrency(investor.total_invested || 0)}</div>
                    <div class="sales-count">${investor.sales_participated || 0}</div>
                    <div></div>
                    <div>
                        <button class="action-button view-details" data-address="${investor.address}">
                            View Details
                        </button>
                    </div>
                `;
                
                // Insert sales badges into the 5th column
                row.children[4].appendChild(salesBadges);
                
                tableBody.appendChild(row);
            });
            
            // Add event listeners to view details buttons
            document.querySelectorAll('.view-details').forEach(button => {
                button.addEventListener('click', () => {
                    const address = button.getAttribute('data-address');
                    showInvestorDetails(address);
                });
            });
        }
        
        // Function to update pagination controls
        function updatePagination() {
            const prevButton = document.getElementById('prev-page');
            const nextButton = document.getElementById('next-page');
            const pageNumbers = document.getElementById('page-numbers');
            const pageJumpInput = document.getElementById('page-jump-input');
            
            // Update prev/next buttons
            prevButton.disabled = currentPage <= 1;
            prevButton.classList.toggle('disabled', currentPage <= 1);
            
            nextButton.disabled = currentPage >= totalPages;
            nextButton.classList.toggle('disabled', currentPage >= totalPages);
            
            // Update page jump input max
            if (pageJumpInput) {
                pageJumpInput.setAttribute('max', totalPages);
                pageJumpInput.placeholder = `1-${totalPages}`;
            }
            
            // Generate page numbers
            pageNumbers.innerHTML = '';
            
            // Determine range of pages to show
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            
            // Adjust start if end is maxed out
            if (endPage === totalPages) {
                startPage = Math.max(1, endPage - 4);
            }
            
            // Add first page button if not in range
            if (startPage > 1) {
                const firstPageButton = document.createElement('button');
                firstPageButton.className = 'page-button';
                firstPageButton.textContent = '1';
                firstPageButton.addEventListener('click', () => goToPage(1));
                pageNumbers.appendChild(firstPageButton);
                
                // Add ellipsis if needed
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'text-gray-500 mx-1';
                    ellipsis.textContent = '...';
                    pageNumbers.appendChild(ellipsis);
                }
            }
            
            // Add page number buttons
            for (let i = startPage; i <= endPage; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `page-button ${i === currentPage ? 'active' : ''}`;
                pageButton.textContent = i;
                pageButton.addEventListener('click', () => goToPage(i));
                pageNumbers.appendChild(pageButton);
            }
            
            // Add last page button if not in range
            if (endPage < totalPages) {
                // Add ellipsis if needed
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'text-gray-500 mx-1';
                    ellipsis.textContent = '...';
                    pageNumbers.appendChild(ellipsis);
                }
                
                const lastPageButton = document.createElement('button');
                lastPageButton.className = 'page-button';
                lastPageButton.textContent = totalPages;
                lastPageButton.addEventListener('click', () => goToPage(totalPages));
                pageNumbers.appendChild(lastPageButton);
            }
        }
        
        // Function to go to a specific page
        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            fetchInvestors();
        }
        
        // Function to update the stats section with global data
        function updateStats() {
            // Fetch global stats from the backend for ALL statistics
            fetch('/api/global-stats')
                .then(response => response.json())
                .then(data => {
                    // Now using data.total_investors for the investor count
                    document.getElementById('total-investors').textContent = (data.total_investors || 0).toLocaleString();
                    document.getElementById('total-investment').textContent = formatCurrency(data.total_investment || 0);
                    document.getElementById('largest-investor').textContent = formatCurrency(data.largest_investment || 0);
                    
                    // Hardcode the Most Active Investor to 11 sales
                    document.getElementById('most-active-investor').textContent = '13 sales';
                })
                .catch(error => {
                    console.error('Error fetching global stats:', error);
                    
                    // Fallback to hardcoded values from homepage data
                    document.getElementById('total-investors').textContent = "6,625";  // Updated from homepage data
                    document.getElementById('total-investment').textContent = formatCurrency(18548209.00);
                    
                    // Use the investor with the highest rank for largest investor if available
                    const topInvestor = investors.find(investor => investor.rank === 1);
                    if (topInvestor) {
                        document.getElementById('largest-investor').textContent = formatCurrency(topInvestor.total_invested || 0);
                    } else {
                        document.getElementById('largest-investor').textContent = 'N/A';
                    }
                    
                    // Hardcode the Most Active Investor to 11 sales
                    document.getElementById('most-active-investor').textContent = '13 sales';
                });
        }
        
        // Helper function to find the maximum sales participation value among all investors
        function findMaxSalesParticipation() {
            // If we don't have investors data, return 0
            if (!Array.isArray(investors) || investors.length === 0) {
                return 0;
            }
            
            // Filter to EVM investors only
            const evmInvestors = investors.filter(investor => !isSolanaAddress(investor.address));
            
            // Find maximum sales participated value
            const maxSales = Math.max(...evmInvestors.map(investor => investor.sales_participated || 0));
            
            return maxSales;
        }
        
        // Function to check if address is a Solana address
        function isSolanaAddress(address) {
            if (!address) return false;
            // Solana addresses don't start with '0x', and they're typically base58 encoded
            return !address.startsWith('0x') && address.length >= 32 && address.length <= 44;
        }
        
        // Function to show investor details in modal
        async function showInvestorDetails(address) {
            try {
                // Show loading state in modal
                const modalTitle = document.getElementById('modal-title');
                const modalBody = document.getElementById('modal-body');
                
                modalTitle.textContent = 'Loading Investor Details...';
                modalBody.innerHTML = `
                    <div class="text-center py-4">
                        <i class="fas fa-circle-notch fa-spin fa-2x mb-3"></i>
                        <p>Loading detailed information...</p>
                    </div>
                `;
                
                // Show modal
                document.getElementById('investor-modal').classList.add('active');
                
                // For Solana addresses, first try to get the exact cased version from source
                let properCasedAddress = address;
                if (isSolanaAddress(address)) {
                    try {
                        // Fetch the correctly cased address from the source file
                        const sourceResponse = await fetch('/api/original-address?address=' + address.toLowerCase());
                        if (sourceResponse.ok) {
                            const sourceData = await sourceResponse.json();
                            if (sourceData && sourceData.original_address) {
                                properCasedAddress = sourceData.original_address;
                            }
                        }
                    } catch (e) {
                        console.warn('Could not fetch original address case:', e);
                    }
                }
                
                // Fetch investor details
                const response = await fetch(`/api/investor/${address}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch investor details');
                }
                
                const investor = await response.json();
                
                // Update modal title
                const isSolana = isSolanaAddress(investor.address);
                const displayAddress = isSolana 
                    ? (properCasedAddress || investor.original_address || investor.address)
                    : investor.address;
                
                modalTitle.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span class="text-gray-400">Investor:</span>
                            <span class="font-mono" style="color: #ffffff; font-weight: 600;">${formatAddress(investor.address)}</span>
                            <button onclick="copyToClipboard('${displayAddress}', this)" style="background: rgba(255, 87, 34, 0.1); border: 1px solid rgba(255, 87, 34, 0.3); color: #ff5722; padding: 0.15rem 0.2rem; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;" title="Copy full address">
                                <i class="fas fa-copy" style="font-size: 0.65rem;"></i>
                            </button>
                            ${isSolana ? '<span class="text-xs text-blue-400">(Solana)</span>' : ''}
                        </div>
                        <a href="${isSolana ? `https://solscan.io/account/${displayAddress}` : `https://debank.com/profile/${displayAddress}`}" target="_blank" style="color: #00bfff; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.5rem; background: rgba(0, 191, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 191, 255, 0.3);">
                            <i class="fas fa-external-link-alt"></i> View on ${isSolana ? 'Solscan' : 'Debank'}
                        </a>
                    </div>
                `;
                
                // Create modal content
                let modalContent = `
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div class="bg-opacity-10 bg-white p-3 rounded">
                            <div class="text-gray-400 text-sm">Total Invested</div>
                            <div class="text-xl font-bold text-orange-500">${formatCurrency(investor.total_invested || 0)}</div>
                        </div>
                        <div class="bg-opacity-10 bg-white p-3 rounded">
                            <div class="text-gray-400 text-sm">Sales Participated</div>
                            <div class="text-xl font-bold text-orange-500">${investor.sales_participated || 0}</div>
                        </div>
                    </div>
                    
                    <h4 class="text-lg font-semibold mb-3 border-b border-gray-700 pb-2">Investment Breakdown</h4>
                `;
                
                // Add sales breakdown
                if (investor.sales && investor.sales.length > 0) {
                    modalContent += '<div class="space-y-2">';
                    
                    investor.sales.forEach(sale => {
                        const saleClass = projectColors[sale.sale] || '';
                        const saleName = projectNames[sale.sale] || sale.sale;
                        const saleLogo = projectLogos[sale.sale] || 'legion.png'; // Fallback to legion logo
                        
                        modalContent += `
                            <div class="sale-item">
                                <div class="sale-name" style="display: flex; align-items: center;">
                                    <img src="${saleLogo}" alt="${saleName}" style="width: 24px; height: 24px; border-radius: 6px; margin-right: 0.75rem; object-fit: cover; border: 1px solid rgba(255, 87, 34, 0.2);">
                                    <span class="sale-badge ${saleClass} mr-2">${saleName}</span>
                                </div>
                                <div class="sale-amount">${formatCurrency(sale.amount)}</div>
                            </div>
                        `;
                    });
                    
                    modalContent += '</div>';
                } else {
                    modalContent += `
                        <div class="text-center text-gray-500 py-4">
                            No sales data available for this investor.
                        </div>
                    `;
                }
                

                
                // Update modal body
                modalBody.innerHTML = modalContent;
                
            } catch (error) {
                console.error('Error fetching investor details:', error);
                document.getElementById('modal-body').innerHTML = `
                    <div class="text-center text-red-500 py-4">
                        <i class="fas fa-exclamation-circle fa-2x mb-3"></i>
                        <p>Error loading investor details. Please try again later.</p>
                    </div>
                `;
            }
        }
        
        // Set up event listeners
        function setupEventListeners() {
            // Pagination controls
            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    goToPage(currentPage - 1);
                }
            });
            
            document.getElementById('next-page').addEventListener('click', () => {
                if (currentPage < totalPages) {
                    goToPage(currentPage + 1);
                }
            });
            
            // Page jump feature
            const pageJumpButton = document.getElementById('page-jump-button');
            const pageJumpInput = document.getElementById('page-jump-input');
            
            if (pageJumpButton && pageJumpInput) {
                // Go button click
                pageJumpButton.addEventListener('click', () => {
                    const pageNumber = parseInt(pageJumpInput.value);
                    if (!isNaN(pageNumber) && pageNumber >= 1 && pageNumber <= totalPages) {
                        goToPage(pageNumber);
                    } else {
                        // Visual feedback for invalid input
                        pageJumpInput.style.borderColor = '#ff0000';
                        setTimeout(() => {
                            pageJumpInput.style.borderColor = '#333343';
                        }, 1000);
                    }
                });
                
                // Enter key in input
                pageJumpInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const pageNumber = parseInt(pageJumpInput.value);
                        if (!isNaN(pageNumber) && pageNumber >= 1 && pageNumber <= totalPages) {
                            goToPage(pageNumber);
                        } else {
                            // Visual feedback for invalid input
                            pageJumpInput.style.borderColor = '#ff0000';
                            setTimeout(() => {
                                pageJumpInput.style.borderColor = '#333343';
                            }, 1000);
                        }
                    }
                });
                
                // Update max attribute when totalPages changes
                pageJumpInput.setAttribute('max', totalPages);
            }
            
            // Sort buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.addEventListener('click', () => {
                    // Update active state
                    document.querySelectorAll('.filter-button').forEach(b => {
                        b.classList.remove('active');
                    });
                    button.classList.add('active');
                    
                    // Update sort and fetch data
                    currentSort = button.getAttribute('data-sort');
                    currentPage = 1; // Reset to first page
                    fetchInvestors();
                });
            });
            
            // Search input
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', () => {
                searchTerm = searchInput.value.trim();
                
                // Use debouncing to avoid too many requests
                clearTimeout(searchInput.timeout);
                searchInput.timeout = setTimeout(() => {
                    currentPage = 1; // Reset to first page
                    fetchInvestors();
                }, 300);
            });
            
            // Modal close button
            document.getElementById('modal-close').addEventListener('click', () => {
                document.getElementById('investor-modal').classList.remove('active');
            });
            
            // Close modal when clicking on backdrop
            document.getElementById('investor-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('investor-modal')) {
                    document.getElementById('investor-modal').classList.remove('active');
                }
            });
            
            // Escape key to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.getElementById('investor-modal').classList.contains('active')) {
                    document.getElementById('investor-modal').classList.remove('active');
                }
            });
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchInvestors();
        });
    </script>
